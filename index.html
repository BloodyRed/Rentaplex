<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rentaplex</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="description" content="Rentaplex : calculez la rentabilité d'un immeuble locatif au Québec (hypothèque, taxes, impôt, taxe de bienvenue) et comparez plusieurs immeubles.">
<meta name="theme-color" content="#1F6A47">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8EBE7; --surface:#F7F8F5; --ink:#1C2630; --muted:#56626D; --line:#C7CEC8;
  --steel:#2F5170; --good:#1F6A47; --good-bg:#D8ECDF; --warn:#8A5A00; --warn-bg:#F4E5C2;
  --bad:#9E241C; --bad-bg:#F5D8D3; --focus:#2F5170;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --cond:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141A1F; --surface:#1C242B; --ink:#E4E9E6; --muted:#9BA7B0; --line:#33404A;
    --steel:#8DB0CF; --good:#6FCB9A; --good-bg:#16342A; --warn:#E6B656; --warn-bg:#382C12;
    --bad:#F18C82; --bad-bg:#3C1D1A; --focus:#8DB0CF;
  }
}
:root[data-theme="dark"]{
  --bg:#141A1F; --surface:#1C242B; --ink:#E4E9E6; --muted:#9BA7B0; --line:#33404A;
  --steel:#8DB0CF; --good:#6FCB9A; --good-bg:#16342A; --warn:#E6B656; --warn-bg:#382C12;
  --bad:#F18C82; --bad-bg:#3C1D1A; --focus:#8DB0CF;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--steel)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.top{max-width:1240px;margin:0 auto;padding:2rem 1.25rem 1rem;display:flex;flex-wrap:wrap;gap:1rem;align-items:flex-end;justify-content:space-between}
.top h1{font-family:var(--cond);font-weight:700;font-size:clamp(1.9rem,4vw,2.8rem);line-height:1.05;margin:0;letter-spacing:-.01em;max-width:18ch}
.top p{margin:.5rem 0 0;color:var(--muted);max-width:60ch}
.btn{font:inherit;font-size:.9rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:.5rem .9rem;border-radius:6px;cursor:pointer}
.btn:hover{border-color:var(--steel)}
.layout{max-width:1240px;margin:0 auto;padding:0 1.25rem 3rem;display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:2rem;align-items:start}
form section{border-top:2px solid var(--ink);padding:1.25rem 0 1.75rem}
form h2{font-family:var(--cond);font-weight:600;font-size:1.35rem;margin:0 0 .25rem}
form h3{font-size:.95rem;font-weight:600;margin:1.4rem 0 .6rem;color:var(--muted)}
.lead{color:var(--muted);margin:0 0 1rem;font-size:.92rem;max-width:65ch}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem 1.25rem}
.field label{display:block;font-size:.88rem;font-weight:500;margin-bottom:.3rem}
.inp{display:flex;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.inp:focus-within{border-color:var(--focus);box-shadow:0 0 0 1px var(--focus)}
.inp input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-variant-numeric:tabular-nums;padding:.5rem .65rem}
.inp input:focus{outline:none}
.suf{padding:.5rem .6rem;color:var(--muted);font-size:.85rem;border-left:1px solid var(--line);white-space:nowrap;display:flex;align-items:center}
.field small,.check-wrap small{display:block;color:var(--muted);font-size:.8rem;margin-top:.3rem;line-height:1.4}
.check-wrap{grid-column:1/-1}
.check{display:flex;gap:.55rem;align-items:center;font-weight:500;font-size:.92rem;cursor:pointer}
.check input{width:1.1rem;height:1.1rem;accent-color:var(--steel)}
.units{width:100%;border-collapse:collapse;margin-bottom:.75rem}
.units th{text-align:left;font-size:.8rem;font-weight:500;color:var(--muted);padding:0 .4rem .4rem 0}
.units td{padding:.3rem .4rem .3rem 0;vertical-align:middle}
.units input[type=text],.units input[type=number]{width:100%;font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:.45rem .55rem;font-variant-numeric:tabular-nums}
.units .del{border:0;background:none;color:var(--muted);cursor:pointer;font-size:1.2rem;padding:.2rem .4rem;border-radius:4px}
.units .del:hover{color:var(--bad)}
.units td.own{white-space:nowrap}
aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 1rem);max-height:calc(100vh - 2rem);overflow:auto;padding-bottom:1rem}
.verdict{border-radius:10px;padding:1.25rem 1.3rem 1.3rem;background:var(--s-bg);color:var(--ink);border:2px solid var(--s)}
.verdict[data-s=good]{--s:var(--good);--s-bg:var(--good-bg)}
.verdict[data-s=warn]{--s:var(--warn);--s-bg:var(--warn-bg)}
.verdict[data-s=bad]{--s:var(--bad);--s-bg:var(--bad-bg)}
.v-title{font-family:var(--cond);font-weight:700;font-size:1.6rem;color:var(--s);margin:0;line-height:1.1}
.v-sub{margin:.3rem 0 1rem;font-size:.92rem}
.v-big{font-family:var(--cond);font-weight:700;font-size:clamp(2.6rem,6vw,3.4rem);line-height:1;color:var(--s);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.v-big-l{font-size:.85rem;margin-top:.3rem}
.v-row{display:flex;gap:1.5rem;margin-top:1rem;flex-wrap:wrap}
.v-row div{font-size:.85rem}
.v-row strong{display:block;font-family:var(--cond);font-size:1.3rem;font-variant-numeric:tabular-nums}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1rem 1.1rem;margin-top:1rem}
.panel h2{font-size:1rem;font-weight:600;margin:0 0 .7rem}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:.45rem;font-size:.9rem}
.checks li{display:grid;grid-template-columns:1.3rem 1fr;gap:.3rem}
.checks .ok{color:var(--good);font-weight:600}
.checks .no{color:var(--bad);font-weight:600}
.kv{display:grid;grid-template-columns:1fr auto;gap:.35rem 1rem;font-size:.9rem;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.kv dt.sum,.kv dd.sum{border-top:1px solid var(--line);padding-top:.35rem;color:var(--ink);font-weight:600}
.bar{display:flex;height:22px;border-radius:5px;overflow:hidden;margin:.2rem 0 .7rem;background:var(--line)}
.bar span{display:block;height:100%}
.legend{display:grid;grid-template-columns:auto 1fr auto;gap:.3rem .55rem;font-size:.85rem;align-items:center}
.sw{width:.75rem;height:.75rem;border-radius:2px}
.legend b{font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
.warns{margin:.75rem 0 0;padding:.7rem .85rem;border-left:3px solid var(--warn);background:var(--warn-bg);font-size:.86rem;border-radius:0 6px 6px 0}
.warns:empty{display:none}
.warns p{margin:0}.warns p+p{margin-top:.4rem}
.wide{max-width:1240px;margin:0 auto;padding:0 1.25rem 2.5rem}
.wide h2{font-family:var(--cond);font-weight:600;font-size:1.5rem;margin:0 0 .4rem;border-top:2px solid var(--ink);padding-top:1.25rem}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table.proj{border-collapse:collapse;width:100%;font-size:.88rem;font-variant-numeric:tabular-nums;min-width:820px}
table.proj th,table.proj td{padding:.5rem .7rem;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
table.proj th:first-child,table.proj td:first-child{text-align:left}
table.proj thead th{font-weight:600;font-size:.8rem;color:var(--muted);background:var(--bg)}
td.neg{color:var(--bad)} td.pos{color:var(--good)}
.sale{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1rem;margin-top:1rem}
.sale div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.8rem 1rem;font-size:.85rem}
.sale strong{display:block;font-family:var(--cond);font-size:1.4rem;font-variant-numeric:tabular-nums;margin-top:.15rem}
.notes{font-size:.9rem;color:var(--muted);max-width:75ch}
.notes li{margin-bottom:.45rem}
.inp select{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;padding:.5rem .65rem}
.inp input:disabled,.inp select:disabled{opacity:.5}
.btn:disabled{opacity:.45;cursor:not-allowed}
.estimate{margin-top:1rem;display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center}
.estimate p{margin:0;font-size:.92rem;font-weight:500;font-variant-numeric:tabular-nums}
.tabbar{max-width:1240px;margin:0 auto;padding:0 1.25rem 1.25rem}
.tabs-row{display:flex;gap:.5rem;align-items:flex-end;border-bottom:2px solid var(--ink);flex-wrap:wrap}
.tabs{display:flex;gap:.25rem;overflow-x:auto;flex:1 1 auto;min-width:0;align-items:flex-end}
.tab{font:inherit;font-weight:500;font-size:.92rem;border:1px solid var(--line);border-bottom:0;background:transparent;color:var(--muted);padding:.5rem .9rem;border-radius:6px 6px 0 0;cursor:pointer;white-space:nowrap;max-width:16rem;overflow:hidden;text-overflow:ellipsis}
.tab:hover{color:var(--ink)}
.tab[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs-row .btn{margin-bottom:.35rem;text-decoration:none}
.tabtools{display:flex;flex-wrap:wrap;gap:.5rem .75rem;align-items:center;margin-top:.75rem;font-size:.9rem}
.tabtools label{font-weight:500}
.tabtools input{font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:.45rem .6rem;min-width:min(16rem,100%)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.cmp-pick{display:flex;flex-wrap:wrap;gap:.5rem 1.4rem;margin:.25rem 0 1rem}
table.proj.cmp{min-width:560px}
table.cmp td.best{color:var(--good);font-weight:700}
table.cmp thead th{text-align:right}
.pill{display:inline-block;padding:.15rem .6rem;border-radius:999px;font-weight:600;font-size:.82rem;background:var(--s-bg);color:var(--s)}
.pill[data-s=good]{--s:var(--good);--s-bg:var(--good-bg)}
.pill[data-s=warn]{--s:var(--warn);--s-bg:var(--warn-bg)}
.pill[data-s=bad]{--s:var(--bad);--s-bg:var(--bad-bg)}
.linkbtn{font:inherit;font-weight:600;background:none;border:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0}
.brand{display:flex;align-items:center;gap:.55rem;font-family:var(--cond);font-weight:700;font-size:1.25rem;margin-bottom:.9rem;letter-spacing:.01em}
.brand>svg{width:34px;height:34px;flex:none}
.iconbtn{display:inline-grid;place-items:center;width:2.3rem;height:2.3rem;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;padding:0;position:relative;flex:none}
.iconbtn:hover{border-color:var(--ink)}
.iconbtn svg{width:1.2rem;height:1.2rem}
.badge{position:absolute;top:-.4rem;right:-.4rem;min-width:1.15rem;height:1.15rem;border-radius:999px;background:var(--steel);color:var(--bg);font-size:.7rem;font-weight:600;display:grid;place-items:center;padding:0 .25rem}
.badge[hidden]{display:none}
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .35);z-index:20}
.scrim[hidden]{display:none}
.settings{position:fixed;top:0;left:0;bottom:0;width:min(460px,100%);background:var(--bg);border-right:2px solid var(--ink);z-index:21;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 1.25rem) 1.25rem calc(env(safe-area-inset-bottom,0px) + 1.5rem);transform:translateX(-102%);visibility:hidden}
.settings.open{transform:none;visibility:visible}
@media (prefers-reduced-motion:no-preference){.settings{transition:transform .22s ease,visibility .22s}}
.set-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
.set-head h2{font-family:var(--cond);font-weight:700;font-size:1.6rem;margin:0}
.set-sec{border-top:2px solid var(--ink);padding:1rem 0 1.4rem}
.set-sec h3{font-size:1.02rem;margin:0 0 .8rem;display:flex;align-items:center}
.tw{display:flex;align-items:center;border:1px solid var(--line);border-bottom:0;border-radius:6px 6px 0 0;flex:none;max-width:100%}
.tw.on{background:var(--ink);border-color:var(--ink)}
.tw .tab{border:0}
.tacts{display:flex;gap:.1rem;padding-right:.3rem}
.tacts button{display:grid;place-items:center;width:1.9rem;height:1.9rem;border:0;background:transparent;color:var(--bg);border-radius:4px;cursor:pointer;opacity:.75;padding:0}
.tacts button:hover{opacity:1;background:color-mix(in srgb,var(--bg) 20%,transparent)}
.tacts button:disabled{opacity:.3;cursor:not-allowed;background:transparent}
.tacts svg{width:1rem;height:1rem}
.tedit{font:inherit;font-weight:500;font-size:.92rem;border:0;background:var(--surface);color:var(--ink);padding:.35rem .5rem;margin:.25rem .3rem;border-radius:4px;width:12rem;max-width:60vw}
.drawers{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:.9rem;align-items:flex-start}
.drawer{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.55rem .9rem;flex:1 1 320px;min-width:0}
.drawer summary{cursor:pointer;font-weight:600;font-size:.92rem}
.drawer[open] summary{margin-bottom:.75rem}
.dot{display:inline-block;width:.55rem;height:.55rem;border-radius:50%;background:var(--muted);margin-right:.45rem;vertical-align:middle}
.dot.on{background:var(--good)} .dot.err{background:var(--bad)}
.arow{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;padding:.45rem 0;border-top:1px solid var(--line)}
.arow:first-child{border-top:0}
.arow span{flex:1 1 10rem;font-weight:500}
.cloud-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.75rem 1rem}
.cloud-grid .full{grid-column:1/-1}
.cloud-grid input[type=text],.cloud-grid input[type=password],.cloud-grid select{width:100%;font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:.45rem .6rem}
.cloud-grid label.lbl{display:block;font-size:.85rem;font-weight:500;margin-bottom:.25rem}
.cbtns{display:flex;flex-wrap:wrap;gap:.5rem}
#cStatus{margin:0;font-size:.88rem}
#cStatus.err{color:var(--bad)} #cStatus.ok{color:var(--good)}
.drawer small{display:block;color:var(--muted);font-size:.8rem;line-height:1.45}
.ver{font-size:.85rem;color:var(--muted)}
.ver summary{cursor:pointer;font-weight:500}
.ver ul{margin:.5rem 0 0;padding-left:1.2rem}
.ver li{margin-bottom:.25rem}
.mbar{display:none}
@media (max-width:920px){
  .layout{grid-template-columns:1fr}
  aside{position:static;max-height:none;overflow:visible}
  .mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:5;gap:.75rem;align-items:center;justify-content:space-between;
    padding:.7rem 1rem calc(.7rem + env(safe-area-inset-bottom,0px));background:var(--s-bg);border-top:2px solid var(--s);color:var(--ink);text-decoration:none}
  .mbar[data-s=good]{--s:var(--good);--s-bg:var(--good-bg)}
  .mbar[data-s=warn]{--s:var(--warn);--s-bg:var(--warn-bg)}
  .mbar[data-s=bad]{--s:var(--bad);--s-bg:var(--bad-bg)}
  .mbar b{font-family:var(--cond);font-size:1.35rem;color:var(--s);font-variant-numeric:tabular-nums}
  body{padding-bottom:4.5rem}
}
@media (prefers-reduced-motion:no-preference){.verdict,.mbar{transition:background-color .25s,border-color .25s}}
</style>
</head>
<body>
<header class="top">
  <div>
    <div class="brand"><button type="button" class="iconbtn" id="openSettings" data-ta="setOpen" aria-expanded="false" aria-controls="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg><span class="badge" id="setBadge" hidden></span></button><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#1F6A47"/><path d="M9 26V10h14v16" fill="none" stroke="#fff" stroke-width="2"/><path d="M7.5 9.5h17" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><g fill="#fff"><rect x="11.5" y="13" width="3" height="3"/><rect x="17.5" y="13" width="3" height="3"/><rect x="11.5" y="18.5" width="3" height="3"/><rect x="17.5" y="18.5" width="3" height="3"/></g></svg><span>Rentaplex</span></div>
    <h1 data-t="h1"></h1>
    <p data-t="intro"></p>
  </div>
  <div style="display:flex;gap:.5rem;flex-wrap:wrap">
    <button class="btn" type="button" id="lang" aria-pressed="false"></button>
    <button class="btn" type="button" id="reset" data-t="reset"></button>
  </div>
</header>

<div class="tabbar">
  <div class="tabs-row">
    <div class="tabs" role="tablist" id="tabs"></div>
    <button class="btn" type="button" id="tabAdd" data-t="tabNew"></button>
    <a class="btn" href="#compare" data-t="cmpLink"></a>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="settings" id="settings" role="dialog" aria-modal="true" aria-labelledby="setT" aria-hidden="true" inert>
  <div class="set-head"><h2 id="setT" data-t="setT"></h2><button type="button" class="iconbtn" id="closeSettings" data-ta="close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>
  <section class="set-sec">
    <h3><span class="dot" id="cDot"></span><span data-t="cloudT"></span></h3>
    <div class="cloud-grid">
        <div><label class="lbl" for="cBin" data-t="cBin"></label><input id="cBin" type="text" autocomplete="off" spellcheck="false"></div>
        <div><label class="lbl" for="cType" data-t="cType"></label><select id="cType"><option value="master">X-Master-Key</option><option value="access">X-Access-Key</option></select></div>
        <div class="full"><label class="lbl" for="cKey" data-t="cKey"></label><input id="cKey" type="password" autocomplete="off" spellcheck="false"></div>
        <label class="check full"><input type="checkbox" id="cAuto"><span data-t="cAuto"></span></label>
        <label class="check full"><input type="checkbox" id="cRemember"><span data-t="cRemember"></span></label>
        <div class="cbtns full">
          <button class="btn" type="button" id="cPull" data-t="cPull"></button>
          <button class="btn" type="button" id="cPush" data-t="cPush"></button>
          <button class="btn" type="button" id="cCreate" data-t="cCreate"></button>
          <button class="btn" type="button" id="cForget" data-t="cForget"></button>
        </div>
        <p id="cStatus" class="full" role="status"></p>
        <small class="full" data-t="cHelp"></small>
      </div>
  </section>
  <section class="set-sec">
    <h3 id="archSum"></h3>
    <div id="archList"></div>
  </section>
</div>

<div class="layout">
  <form id="f" novalidate></form>

  <aside id="results" aria-live="polite">
    <div class="verdict" id="verdict" data-s="good">
      <p class="v-title" id="vTitle"></p>
      <p class="v-sub" id="vSub"></p>
      <div class="v-big" id="vMonth"></div>
      <div class="v-big-l" id="vMonthL"></div>

const loc=()=>L==="fr"?"fr-CA":"en-CA";
const money=x=>new Intl.NumberFormat(loc(),{style:"currency",currency:"CAD",maximumFractionDigits:0}).format(Math.round(x)||0);
const pct=(x,d=1)=>isFinite(x)?(x*100).toLocaleString(loc(),{minimumFractionDigits:d,maximumFractionDigits:d})+(L==="fr"?" %":"%"):"n/a";
const num=(x,d=2)=>isFinite(x)?x.toLocaleString(loc(),{minimumFractionDigits:d,maximumFractionDigits:d}):"n/a";

function welcomeTax(b,v){
  const tiers= v.wtScale===1 ? [[0,62900,.005],[62900,315000,.01],[315000,552300,.015],[552300,1104700,.02],[1104700,2136500,.025],[2136500,3113000,.035],[3113000,Infinity,.04]]
    : [[0,v.wt1,.005],[v.wt1,v.wt2,.01],[v.wt2,v.wt3,.015],[v.wt3,Infinity,v.wtRate4/100]];
  let x=0; for(const [lo,hi,r] of tiers){ if(b>lo) x+=(Math.min(b,hi)-lo)*r; } return x;
}
function irr(cfs){
  const npv=r=>cfs.reduce((s,c,k)=>s+c/Math.pow(1+r,k),0);
  let lo=-.99,hi=1.5,flo=npv(lo),fhi=npv(hi);
  if(!isFinite(flo)||!isFinite(fhi)||flo*fhi>0) return null;
  for(let k=0;k<200;k++){const m=(lo+hi)/2,fm=npv(m); if(flo*fm<=0){hi=m;}else{lo=m;flo=fm;}}
  return (lo+hi)/2;
}

function compute(v,U){
  U=U||units;
  const W=[];
  const P=v.price, d=v.downPct/100, H=Math.max(1,Math.min(40,Math.round(v.horizon)||1));
  const nUnits=U.length, owner=U.find(u=>u.owner), oo=!!owner;
  const rented=U.filter(u=>!u.owner), nRented=rented.length;
  const f = nUnits? nRented/nUnits : 1;
  const down=P*d, base=P-down;
  let premRate=0;
  if(d<.2){
    if(!oo) W.push(B("Sans habiter l'immeuble, les prêteurs exigent généralement au moins 20 % de mise de fonds. Ce scénario risque de ne pas être finançable.","If you don't live in the building, lenders generally require at least 20% down. This scenario may not be financeable."));
    else if(P>=1500000) W.push(B("Au-delà de 1,5 M$, l'assurance prêt n'est pas offerte : une mise de fonds de 20 % est requise.","Above $1.5M, mortgage insurance isn't available: 20% down is required."));
    else { const ltv=1-d; premRate= ltv>.9?.04: ltv>.85?.031:.028; }
    if(d<.05) W.push(B("Une mise de fonds sous 5 % n'est pas admissible.","A down payment under 5% isn't eligible."));
  }
  const premium=base*premRate, loan=base+premium, premTax=premium*v.premTaxPct/100;
  const wtBase=Math.max(P,v.evalMun), wtFull=welcomeTax(wtBase,v), wt=v.includeWT===false?0:wtFull;
  const cashNeeded=down+wt+v.notary+v.inspection+v.appraisal+premTax+v.reno+v.otherClose;
  const costBasis=P+wt+v.notary+v.inspection+v.appraisal+v.reno+v.otherClose;
  const i=Math.pow(1+v.rate/200,1/6)-1, n=Math.max(1,v.amort*12);
  const pmt= i>0 ? loan*i/(1-Math.pow(1+i,-n)) : loan/n;
  const gr=v.rentGrowth/100, ge=v.expGrowth/100, ga=v.appreciation/100;
  const rentRented=rented.reduce((s,u)=>s+u.rent,0)*12, rentAll=U.reduce((s,u)=>s+u.rent,0)*12;
  const fixedExp=v.taxMun+v.taxSchool+v.insurance+v.energy+v.snow+v.concierge+v.otherExp;
  let bal=loan, ucc=(P*v.bldPct/100+v.reno)*f, ccaTotal=0;
  const years=[];
  for(let y=0;y<H;y++){
    const g=Math.pow(1+gr,y), e=Math.pow(1+ge,y);
    const gpr=(rentRented+v.otherInc*12)*g, vac=gpr*v.vacancy/100, egi=gpr-vac;
    const gprAll=(rentAll+v.otherInc*12)*g;
    const maint=gprAll*(1-v.vacancy/100)*v.maintPct/100, mgmt=egi*v.mgmtPct/100;
    const capex=v.capex*nUnits*e, fixed=fixedExp*e;
    const opex=fixed+maint+mgmt+capex, noi=egi-opex;
    let intY=0,prY=0;
    for(let m=0;m<12;m++){ if(bal<=0.005)break; const it=bal*i, pr=Math.min(pmt-it,bal); intY+=it; prY+=pr; bal-=pr; }
    const ds=intY+prY, rentalNoi=egi-opex*f, intDed=intY*f;
    let cca=0;
    if(v.useCCA){ cca=Math.min(ucc*v.ccaRate/100*(y===0?.5:1), Math.max(0,rentalNoi-intDed)); ucc-=cca; ccaTotal+=cca; }
    const taxable=rentalNoi-intDed-cca, tax=taxable*v.mr/100;
    const cfPre=noi-ds, cfAfter=cfPre-tax, value=P*Math.pow(1+ga,y+1);
    const noiAll=gprAll*(1-v.vacancy/100)-(fixed+maint+gprAll*(1-v.vacancy/100)*v.mgmtPct/100+capex);
    years.push({y:y+1,gpr,gprAll,egi,opex,fixed,maint,mgmt,capex,noi,noiAll,intY,prY,ds,cca,taxable,tax,cfPre,cfAfter,bal:Math.max(0,bal),value,equity:value-Math.max(0,bal)});
  }
  const last=years[H-1], S=last.value, sellCosts=S*v.sellPct/100;
  const gain=S-sellCosts-costBasis, capTax=Math.max(0,gain)*f*.5*v.mr/100;
  const recap=Math.min(ccaTotal, Math.max(0,S-sellCosts))*v.mr/100;
  const netSale=S-sellCosts-last.bal-capTax-recap;
  const flows=[-cashNeeded].concat(years.map(r=>r.cfAfter)); flows[H]+=netSale;
  const cumCF=years.reduce((s,r)=>s+r.cfAfter,0);
  return {v,W,P,d,down,loan,premium,premTax,wt,wtFull,wtBase,cashNeeded,pmt,years,y1:years[0],H,oo,owner,nRented,
    S,capTax,recap,netSale,tri:irr(flows),cumCF,profitTotal:cumCF+netSale-cashNeeded};
}

let lastMax=null;
function maxPrice(v,U){
  const ok=P=>summary(compute(Object.assign({},v,{price:P}),U)).s==="good";
  if(!ok(1000)) return null;
  let lo=1000, hi=Math.max(v.price,v.askPrice||0,100000)*3;
  if(ok(hi)) return Math.floor(hi/1000)*1000;
  for(let k=0;k<40;k++){ const m=(lo+hi)/2; if(ok(m)) lo=m; else hi=m; }
  return Math.floor(lo/1000)*1000;
}

function summary(r){
  const {v,y1}=r, m=y1.cfAfter/12, fr=L==="fr";
  const dscr=y1.ds>0?y1.noi/y1.ds:Infinity, cap=y1.noiAll/r.P, mrb=r.P/y1.gprAll, coc=y1.cfAfter/r.cashNeeded;
  const breakEven=(y1.opex+y1.ds)/(y1.gpr||1), target=v.targetPerUnit*r.nRented;
  const totalRet=(y1.cfAfter+y1.prY+(y1.value-r.P))/r.cashNeeded;
  let s,title,sub;
  if(!r.oo){
    if(m>=target && dscr>=1.2){s="good";title=fr?"Rentable":"Profitable";sub=fr?"Les loyers couvrent tout et il vous reste un profit au-dessus de votre seuil.":"Rents cover everything and you keep a profit above your target.";}
    else if(m>=0){s="warn";title=fr?"Rentable de justesse":"Barely profitable";sub= m<target?(fr?"Le profit est positif mais sous votre seuil visé. Peu de marge en cas d'imprévu.":"Profit is positive but below your target. Little room for surprises."):(fr?"Profit positif, mais la couverture de la dette est mince.":"Positive profit, but debt coverage is thin.");}
    else{s="bad";title=fr?"Pas rentable":"Not profitable";sub=fr?"Vous devrez ajouter de l'argent chaque mois pour garder l'immeuble.":"You'd have to put in money every month to keep the building.";}
  } else {
    const mkt=r.owner.rent;
    if(m>=0){s="good";title=fr?"Rentable, et vous êtes logé":"Profitable, and you live for free";sub=fr?"Les locataires paient toutes les dépenses, y compris votre logement.":"Tenants pay all expenses, including your own unit.";}
    else if(-m<=mkt){s="good";title=fr?"Avantageux":"Worth it";sub=fr?`Vous habitez sur place pour ${money(-m)} par mois, moins que le loyer du marché de votre logement (${money(mkt)}).`:`You live on site for ${money(-m)} a month, less than your unit's market rent (${money(mkt)}).`;}
    else if(-m<=mkt*1.25){s="warn";title=fr?"À surveiller":"Watch out";sub=fr?`Vous loger vous coûterait ${money(-m)} par mois, un peu plus que le loyer du marché (${money(mkt)}).`:`Living there would cost you ${money(-m)} a month, a bit more than market rent (${money(mkt)}).`;}
    else{s="bad";title=fr?"Pas rentable":"Not profitable";sub=fr?`Vous loger vous coûterait ${money(-m)} par mois, bien plus que le loyer du marché (${money(mkt)}).`:`Living there would cost you ${money(-m)} a month, well above market rent (${money(mkt)}).`;}
  }
  return {m,dscr,cap,mrb,coc,breakEven,target,totalRet,s,title,sub};
}

      ? `<input class="tedit" id="tedit" type="text" maxlength="60" value="${esc(sc.name||"")}" aria-label="${t(STR.rename)}">`
      : `<button type="button" class="tab" role="tab" data-tab="${sc.id}" aria-selected="${on}"${on?` title="${t(STR.renameHint)}"`:""}>${nm}</button>`;
    const acts= on ? `<span class="tacts"><button type="button" data-act="rename" aria-label="${t(STR.rename)} ${nm}" title="${t(STR.rename)}">${IC.pen}</button><button type="button" data-act="dup" aria-label="${t(STR.dup)} ${nm}" title="${t(STR.dup)}">${IC.copy}</button><button type="button" data-act="arch" aria-label="${t(STR.arch)} ${nm}" title="${canArch?t(STR.arch):t(STR.archLast)}"${canArch?"":" disabled"}>${IC.arch}</button></span>` : "";
    return `<div class="tw${on?" on":""}">${label}${acts}</div>`;
  }).join("");
  const te=document.getElementById("tedit"); if(te && document.activeElement!==te){ te.focus(); te.select(); }
  const onEl=document.querySelector(".tw.on"); if(onEl && onEl.scrollIntoView) onEl.scrollIntoView({block:"nearest",inline:"nearest"});
  renderArchive();
}
function renderArchive(){
  const a=archivedList();
  document.getElementById("archSum").textContent=`${t(STR.archT)} (${a.length})`;
  const bd=document.getElementById("setBadge"); bd.textContent=a.length; bd.hidden=!a.length;
  document.getElementById("archList").innerHTML= a.length ? a.map(sc=>`<div class="arow"><span>${esc(sc.name||"—")}</span><button type="button" class="btn" data-restore="${sc.id}">${t(STR.restore)}</button><button type="button" class="btn danger" data-purge="${sc.id}">${archDelArmed===sc.id?t(STR.delConfirm):t(STR.purge)}</button></div>`).join("") : `<small>${t(STR.archEmpty)}</small>`;
}
function startRename(id){ editingId=id; renderTabs(); }
function commitRename(keep){
  const te=document.getElementById("tedit"); if(!te||!editingId)return;
  const sc=scenarios.find(x=>x.id===editingId), v=te.value.trim();
  editingId=null;
  if(keep && v) sc.name=v;
  renderTabs(); renderCompare(); save(true);
  const b=document.querySelector(`[data-tab="${sc.id}"]`); if(b) b.focus();
}
function leaveCurrent(removeIt){
  const vis=visible(), i=vis.findIndex(x=>x.id===active), sc=cur();
  if(removeIt){ scenarios.splice(scenarios.indexOf(sc),1); cmpSel=cmpSel.filter(id=>id!==sc.id); } else sc.archived=true;
  const rest=visible(); setActive(rest[Math.max(0,Math.min(i-1,rest.length-1))]);
  buildForm(); renderTabs(); update();
}
const tabsEl=document.getElementById("tabs");
tabsEl.addEventListener("click",e=>{
  const act=e.target.closest("[data-act]");
  if(act){
    const a=act.dataset.act;
    if(a==="rename") startRename(active);
    else if(a==="dup"){ syncCur(); const src=cur(), sc=newScenario(src.name+" ("+t(STR.copy)+")",src);
      scenarios.splice(scenarios.indexOf(src)+1,0,sc); cmpSel.push(sc.id); switchTo(sc.id); startRename(sc.id); }
    else if(a==="arch"){ if(visible().length<2)return; syncCur(); leaveCurrent(false); }
    return;
  }
  const b=e.target.closest("[data-tab]"); if(b && b.dataset.tab!==active) switchTo(b.dataset.tab);
});
tabsEl.addEventListener("dblclick",e=>{ const b=e.target.closest("[data-tab]"); if(b && b.dataset.tab===active) startRename(active); });
tabsEl.addEventListener("focusout",e=>{ if(e.target.id==="tedit") commitRename(true); });
tabsEl.addEventListener("keydown",e=>{
  if(e.target.id==="tedit"){
    if(e.key==="Enter"){ e.preventDefault(); commitRename(true); }
    else if(e.key==="Escape"){ e.preventDefault(); commitRename(false); }
    return;
  }
  if(e.key==="F2" && e.target.dataset.tab===active){ e.preventDefault(); startRename(active); return; }
  if(e.key!=="ArrowRight"&&e.key!=="ArrowLeft")return;
  if(!e.target.dataset.tab)return;
  const vis=visible(), i=vis.findIndex(x=>x.id===active), j=(i+(e.key==="ArrowRight"?1:-1)+vis.length)%vis.length;
  switchTo(vis[j].id); const nb=document.querySelector(`[data-tab="${vis[j].id}"]`); if(nb) nb.focus();
});
document.getElementById("tabAdd").addEventListener("click",()=>{
  syncCur(); const sc=newScenario(t(STR.defName)+" "+(scenarios.length+1));
  scenarios.push(sc); cmpSel.push(sc.id); switchTo(sc.id); startRename(sc.id);
});
document.getElementById("archList").addEventListener("click",e=>{
  const r=e.target.closest("[data-restore]"), p=e.target.closest("[data-purge]");
  if(r){ scenarios.find(x=>x.id===r.dataset.restore).archived=false; archDelArmed=null; renderTabs(); update(); }
  if(p){
    const id=p.dataset.purge;
    if(archDelArmed!==id){ archDelArmed=id; renderArchive(); setTimeout(()=>{ if(archDelArmed===id){ archDelArmed=null; renderArchive(); } },4000); return; }
    archDelArmed=null; scenarios=scenarios.filter(x=>x.id!==id); cmpSel=cmpSel.filter(x=>x!==id); renderTabs(); update();
  }
});
/* Réglages */
const setEl=document.getElementById("settings"), scrim=document.getElementById("scrim"), gear=document.getElementById("openSettings");
function openSet(){ setEl.classList.add("open"); setEl.removeAttribute("inert"); setEl.setAttribute("aria-hidden","false"); scrim.hidden=false; gear.setAttribute("aria-expanded","true"); document.getElementById("closeSettings").focus(); }
function closeSet(){ if(!setEl.classList.contains("open"))return; setEl.classList.remove("open"); setEl.setAttribute("inert",""); setEl.setAttribute("aria-hidden","true"); scrim.hidden=true; gear.setAttribute("aria-expanded","false"); gear.focus(); }
gear.addEventListener("click",openSet);
document.getElementById("closeSettings").addEventListener("click",closeSet);
scrim.addEventListener("click",closeSet);
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeSet(); });
document.getElementById("cmpPick").addEventListener("change",e=>{
  const id=e.target.dataset.cmp; if(!id)return;
  cmpSel= e.target.checked ? cmpSel.concat(id) : cmpSel.filter(x=>x!==id);
  renderCompare(); save(true);
});
document.getElementById("cmpOut").addEventListener("click",e=>{
  const b=e.target.closest("[data-open]"); if(!b)return;
  switchTo(b.dataset.open); window.scrollTo({top:0,behavior:"smooth"});
});

function renderCompare(){
  const fr=L==="fr", vis=visible();
  document.getElementById("cmpPick").innerHTML=vis.map(sc=>`<label class="check"><input type="checkbox" data-cmp="${sc.id}" ${cmpSel.includes(sc.id)?"checked":""}><span>${esc(sc.name||"—")}</span></label>`).join("");
  const out=document.getElementById("cmpOut");
  const sel=vis.filter(sc=>cmpSel.includes(sc.id));
  if(sel.length<2){ out.innerHTML=`<p class="lead">${t(STR.cmpEmpty)}</p>`; return; }
  const res=sel.map(sc=>{ const r=compute(Object.assign(defVals(),sc.vals),sc.units); return {sc,r,S:summary(r)}; });
  const rows=[
    [fr?"Prix d'achat":"Purchase price",x=>x.r.P,money,"low"],
    [fr?"Nombre de logements":"Number of units",x=>x.sc.units.length,v=>v,null],
    [fr?"Prix demandé":"Asking price",x=>x.r.v.askPrice||null,v=>v?money(v):"—",null],
    [fr?"Prix maximal (verdict vert)":"Highest price (green verdict)",x=>maxPrice(x.r.v,x.sc.units),v=>v==null?"n/a":money(v),"high"],
    [fr?"Liquidités requises":"Cash needed",x=>x.r.cashNeeded,money,"low"],
    [fr?"Taxe de bienvenue":"Welcome tax",x=>x.r.wt,money,"low"],
    [fr?"Net par mois (année 1)":"Net per month (year 1)",x=>x.S.m,money,"high"],
    [fr?"Net par année (année 1)":"Net per year (year 1)",x=>x.r.y1.cfAfter,money,"high"],
    [fr?"Taux de capitalisation":"Cap rate",x=>x.S.cap,v=>pct(v,2),"high"],
    [fr?"Multiplicateur du revenu brut":"Gross rent multiplier",x=>x.S.mrb,v=>num(v,1),"low"],
    [fr?"Couverture de la dette":"Debt coverage (DSCR)",x=>x.S.dscr,v=>num(v),"high"],
    [fr?"Point mort d'occupation":"Break-even occupancy",x=>x.S.breakEven,v=>pct(v,0),"low"],
    [fr?"Rendement sur mise de fonds":"Cash-on-cash return",x=>x.S.coc,v=>pct(v),"high"],
    [fr?"Rendement total année 1":"Total return year 1",x=>x.S.totalRet,v=>pct(v),"high"],
    [fr?"TRI après impôt et revente":"IRR after tax and sale",x=>x.r.tri,v=>v==null?"n/a":pct(v),"high"],
    [fr?"Durée de détention":"Holding period",x=>x.r.H,v=>v+(fr?" ans":" yrs"),null],
    [fr?"Enrichissement total à la revente":"Total wealth gain on sale",x=>x.r.profitTotal,money,"high"]
  ];
  const head=`<thead><tr><th scope="col"></th>${res.map(x=>`<th scope="col"><button type="button" class="linkbtn" data-open="${x.sc.id}">${esc(x.sc.name||"—")}</button></th>`).join("")}</tr></thead>`;
  const verdictRow=`<tr><th scope="row" style="text-align:left;font-weight:500">Verdict</th>${res.map(x=>`<td><span class="pill" data-s="${x.S.s}">${x.S.title}</span></td>`).join("")}</tr>`;
  const body=rows.map(([lab,get,f,better])=>{
    const vs=res.map(get); const fin=vs.filter(v=>v!=null&&isFinite(v));
    let best=null;
    if(better && fin.length>1 && Math.max(...fin)!==Math.min(...fin)) best= better==="high"?Math.max(...fin):Math.min(...fin);
    return `<tr><th scope="row" style="text-align:left;font-weight:500">${lab}</th>${vs.map(v=>{const isB=best!==null&&v===best; return `<td class="${isB?"best":""}">${isB?"★ ":""}${f(v)}</td>`;}).join("")}</tr>`;
  }).join("");
  out.innerHTML=`<div class="scroll"><table class="proj cmp">${head}<tbody>${verdictRow}${body}</tbody></table></div>`;
}

/* ---------- JSONBin ---------- */
const CKEY="rentaplex-jsonbin", API="https://api.jsonbin.io/v3/b";
let cloud={binId:"",keyType:"access",key:"",remember:false,auto:true}, cloudState="off", pushTimer=null, cloudMsg=null;
function loadCloud(){ try{ const o=JSON.parse(localStorage.getItem(CKEY)||"null"); if(o) cloud=Object.assign(cloud,o); }catch(e){} }
function saveCloud(){ try{ localStorage.setItem(CKEY,JSON.stringify(Object.assign({},cloud,{key:cloud.remember?cloud.key:""}))); }catch(e){} }
const connected=()=>!!(cloud.binId&&cloud.key);
function cHeaders(extra){ return Object.assign({"Content-Type":"application/json",[cloud.keyType==="master"?"X-Master-Key":"X-Access-Key"]:cloud.key},extra||{}); }
function status(msg,kind){ cloudMsg={msg,kind}; cloudState= kind==="err"?"err":(connected()?"on":"off"); renderCloudStatus(); }
function renderCloudStatus(){
  const el=document.getElementById("cStatus");
  el.textContent= cloudMsg ? t(cloudMsg.msg) : (connected()?B("Prêt.","Ready.")[L]:B("Non connecté. Entrez l'ID du bin et une clé, ou créez un bin.","Not connected. Enter the bin ID and a key, or create a bin.")[L]);
  el.className= cloudMsg&&cloudMsg.kind ? cloudMsg.kind : "";
  document.getElementById("cDot").className="dot"+(cloudState==="err"?" err":(connected()?" on":""));
}
function renderCloud(){
  document.getElementById("cBin").value=cloud.binId; document.getElementById("cType").value=cloud.keyType;
  document.getElementById("cKey").value=cloud.key; document.getElementById("cAuto").checked=cloud.auto;
  document.getElementById("cRemember").checked=cloud.remember; renderCloudStatus();
}
async function apiErr(res){ let m=""; try{ const j=await res.json(); m=j.message||""; }catch(e){} return `${res.status} ${m}`.trim(); }
const NET=B("Impossible de joindre JSONBin. La version publiée dans Claude bloque les connexions externes : utilisez la version GitHub Pages.","Can't reach JSONBin. The version published in Claude blocks external connections: use the GitHub Pages version.");
const hhmm=()=>new Date().toLocaleTimeString(L==="fr"?"fr-CA":"en-CA",{hour:"2-digit",minute:"2-digit"});
function payload(){ return {app:"rentaplex",version:VER,savedAt,scenarios,active,cmp:cmpSel}; }
async function push(){
  clearTimeout(pushTimer); pushTimer=null;
  if(!connected()){ status(B("Entrez l'ID du bin et une clé.","Enter the bin ID and a key."),"err"); return; }
  syncCur(); status(B("Envoi en cours…","Sending…"));
  try{
    const res=await fetch(`${API}/${encodeURIComponent(cloud.binId)}`,{method:"PUT",headers:cHeaders(),body:JSON.stringify(payload())});
    if(!res.ok){ const m=await apiErr(res); status(B("Erreur à l'envoi : "+m,"Send error: "+m),"err"); return; }
    status(B("Envoyé à "+hhmm()+".","Sent at "+hhmm()+"."),"ok");
  }catch(e){ status(NET,"err"); }
}
function schedulePush(){ if(connected()&&cloud.auto){ clearTimeout(pushTimer); pushTimer=setTimeout(push,2500); } }
function applyData(o){
  scenarios=o.scenarios; active=o.active; cmpSel=o.cmp; savedAt=o.savedAt||0; normalize();
  buildForm(); renderTabs(); update(true);
}
async function pull(onlyIfNewer){
  if(!connected()){ status(B("Entrez l'ID du bin et une clé.","Enter the bin ID and a key."),"err"); return; }
  status(B("Chargement…","Loading…"));
  try{
    const res=await fetch(`${API}/${encodeURIComponent(cloud.binId)}/latest?meta=false`,{headers:cHeaders()});
    if(!res.ok){ const m=await apiErr(res); status(B("Erreur au chargement : "+m,"Load error: "+m),"err"); return; }
    const o=await res.json();
    if(!o||o.app!=="rentaplex"||!Array.isArray(o.scenarios)||!o.scenarios.length){
      if(onlyIfNewer){ await push(); return; }
      status(B("Ce bin ne contient pas encore de données Rentaplex. Cliquez sur « Envoyer vers JSONBin ».","This bin has no Rentaplex data yet. Click Send to JSONBin."),"err"); return;
    }
    if(onlyIfNewer && (o.savedAt||0)<savedAt){ await push(); return; }
    applyData(o); status(B("Chargé à "+hhmm()+".","Loaded at "+hhmm()+"."),"ok");
  }catch(e){ status(NET,"err"); }
}
async function createBin(){
  if(!cloud.key){ status(B("Entrez d'abord votre clé.","Enter your key first."),"err"); return; }
  syncCur(); status(B("Création du bin…","Creating bin…"));
  try{
    const res=await fetch(API,{method:"POST",headers:cHeaders({"X-Bin-Name":"Rentaplex","X-Bin-Private":"true"}),body:JSON.stringify(payload())});
    if(!res.ok){ const m=await apiErr(res); status(B("Erreur à la création : "+m,"Create error: "+m),"err"); return; }
    const j=await res.json(); cloud.binId=(j.metadata&&j.metadata.id)||""; saveCloud(); renderCloud();
    status(B("Bin créé et données envoyées.","Bin created and data sent."),"ok");
  }catch(e){ status(NET,"err"); }
}
const cIn=(id,k,fn)=>document.getElementById(id).addEventListener("input",e=>{ cloud[k]=fn(e.target); saveCloud(); cloudMsg=null; renderCloudStatus(); });
cIn("cBin","binId",x=>x.value.trim()); cIn("cKey","key",x=>x.value.trim()); cIn("cType","keyType",x=>x.value);
cIn("cAuto","auto",x=>x.checked); cIn("cRemember","remember",x=>x.checked);
document.getElementById("cPull").addEventListener("click",()=>pull(false));
document.getElementById("cPush").addEventListener("click",push);
document.getElementById("cCreate").addEventListener("click",createBin);
document.getElementById("cForget").addEventListener("click",()=>{ cloud={binId:"",keyType:"access",key:"",remember:false,auto:true}; try{localStorage.removeItem(CKEY);}catch(e){} cloudMsg=null; renderCloud(); });

/* ---------- Stockage local ---------- */
function normalize(){
  if(!Array.isArray(scenarios)||!scenarios.length) scenarios=[newScenario(t(STR.defName)+" 1")];
  scenarios.forEach(x=>{ x.archived=!!x.archived; if(!x.vals) x.vals=defVals(); if(!Array.isArray(x.units)||!x.units.length) x.units=defUnits(); });
  if(!visible().length) scenarios[0].archived=false;
  if(!cur()||cur().archived) active=visible()[0].id;
  if(!Array.isArray(cmpSel)) cmpSel=scenarios.map(x=>x.id);
  cmpSel=cmpSel.filter(id=>scenarios.some(x=>x.id===id));
  setActive(cur());
}
function save(dirty){
  if(dirty){ savedAt=Date.now(); schedulePush(); }
  try{ localStorage.setItem(KEY2,JSON.stringify({savedAt,scenarios,active,cmp:cmpSel})); }catch(e){}
}
function load(){
  try{ const l=localStorage.getItem(LKEY); if(l==="en"||l==="fr") L=l; }catch(e){}
  try{
    const raw2=localStorage.getItem(KEY2);
    if(raw2){ const o=JSON.parse(raw2); if(o&&Array.isArray(o.scenarios)){ scenarios=o.scenarios; active=o.active; cmpSel=o.cmp; savedAt=o.savedAt||0; } }
    else { const raw=localStorage.getItem(KEY); if(raw){ const o=JSON.parse(raw); const sc=newScenario(t(STR.defName)+" 1"); if(o&&o.v) sc.vals=Object.assign(defVals(),o.v); if(o&&Array.isArray(o.units)&&o.units.length) sc.units=o.units; scenarios=[sc]; } }
  }catch(e){}
  normalize(); loadCloud();
}
function update(clean){ syncCur(); render(compute(read())); renderCompare(); save(!clean); }
load(); applyStatic(); buildForm(); renderTabs(); update(true); renderCloud();
if(connected()&&cloud.auto) pull(true);
})();
</script>
